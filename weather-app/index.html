<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Weather UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" id="search-input" placeholder="Enter city name..." spellcheck="false">
            <button id="search-btn">Search</button>
        </div>
        <div class="weather">
            <h1 class="temp" id="temp">22°C</h1>
            <h2 class="city" id="city">New York</h2>
            <div class="details">
                <div class="col">
                    <p>Humidity</p>
                    <p class="humidity" id="humidity">50%</p>
                </div>
                <div class="col">
                    <p>Wind</p>
                    <p class="wind" id="wind">15 km/h</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
